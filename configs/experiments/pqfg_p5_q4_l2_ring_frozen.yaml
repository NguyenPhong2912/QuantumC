experiment:
  name: pqfg_p5_q4_l2_ring_frozen
  seed: 42
  description: >
    Frozen random four-qubit, two-layer ring-entangled PQFG
    after YOLO11n layer 10. Quantum weights are not trained.

model:
  detector: yolo11n
  architecture: yolo11n.yaml
  pretrained: false

placement:
  name: backbone_p5
  target_layer: 10
  channels: 256

pqfg:
  enabled: true
  n_qubits: 4
  n_layers: 2
  hidden_dim: 64
  alpha_init: 0.001
  entanglement: ring
  gamma: 0.5
  trainable_quantum: false
  backend: lightning.qubit
  diff_method: adjoint

runtime:
  detector_device: cuda:0
  quantum_device: cpu
  dtype: float32
  quantum_dtype: float64
